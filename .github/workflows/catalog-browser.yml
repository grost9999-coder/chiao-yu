name: Catalog mobile WebKit touch checks
on:
  pull_request:
    paths: ['ios/**', '.github/workflows/catalog-browser.yml']
  workflow_dispatch:
concurrency:
  group: catalog-browser-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebKit test runner
        run: |
          npm install --no-save --ignore-scripts playwright@1.64.1
          npx playwright install --with-deps webkit
      - name: Exercise actual iPhone touch controls and saved data
        run: |
          node ios/tests/catalog-browser.cjs
          node ios/tests/processing-browser.cjs
          node ios/tests/purchase-marinade-browser.cjs
          node ios/tests/recipe-import-browser.cjs
          node ios/tests/recipe-multi-browser.cjs
          node ios/tests/legacy-purchase-browser.cjs


