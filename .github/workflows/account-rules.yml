name: Account data access and cloud conflict checks
on:
  pull_request:
    paths: ['backend/**', 'ios/VendorLedger/Sources/LedgerAccount*', 'ios/VendorLedger/Sources/LedgerCloudBackup.swift', '.github/workflows/account-rules.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '21'}
      - run: npm install --ignore-scripts
        working-directory: backend
      - run: npm run test:rules
        working-directory: backend
      - run: node --test backend/functions/deletion.test.cjs
