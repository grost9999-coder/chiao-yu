name: VendorLedger
options:
  bundleIdPrefix: com.qiaoyu
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: 攤商記帳王PRO
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    PRODUCT_BUNDLE_IDENTIFIER: com.qiaoyu.vendorbookpro
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  VendorLedger:
    type: application
    platform: iOS
    info:
      path: VendorLedger/Info.plist
      properties:
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: VendorLedger/Sources
      - path: VendorLedger/Web
        type: folder
        buildPhase: resources
      - path: VendorLedger/Resources
        buildPhase: resources
schemes:
  VendorLedger:
    build:
      targets:
        VendorLedger: all
    archive:
      config: Release
