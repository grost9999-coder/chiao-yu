name: VendorLedger
options:
  bundleIdPrefix: com.qiaoyu
  developmentLanguage: zh-Hant
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: VendorLedger/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.qiaoyu.vendorbookpro
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  VendorLedger:
    type: application
    platform: iOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
    sources:
      - path: VendorLedger/Sources
      - path: VendorLedger/Web
        type: folder
        buildPhase: resources
      - path: VendorLedger/Resources
        buildPhase: resources
schemes:
  VendorLedger:
    build:
      targets:
        VendorLedger: all
    archive:
      config: Release
