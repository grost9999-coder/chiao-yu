name: VendorLedger
options:
  bundleIdPrefix: com.qiaoyu
  developmentLanguage: zh-Hant
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.1'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: VendorLedger/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.qiaoyu.vendorbookpro
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  VendorLedger:
    type: application
    platform: iOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1,2'
    sources:
      - path: VendorLedger/Sources
      - path: VendorLedger/Web
        type: folder
        buildPhase: resources
      - path: VendorLedger/Resources
        buildPhase: resources
  VendorLedgerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: VendorLedger
        PRODUCT_BUNDLE_IDENTIFIER: com.qiaoyu.vendorbookpro.uitests
    dependencies:
      - target: VendorLedger
schemes:
  VendorLedger:
    build:
      targets:
        VendorLedger: all
    archive:
      config: Release

    test:
      targets: [VendorLedgerUITests]
