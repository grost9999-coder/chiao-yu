<style id="ledger-fresh-theme">/* Fresh visual theme. Storage keys, record schemas and accounting are unchanged. */
:root{color-scheme:light;--bg:#f6f8f5;--surface:#fff;--surface-2:#f1f6f2;--primary:#ddf5b7;--primary-2:#b9e787;--ink:#243c34;--ink-2:#64766f;--border:#e3ebe5;--green:#21735d;--green-bg:#e9f7ee;--red:#b54843;--red-bg:#fff0ec;--blue:#477c99;--radius:20px}
html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
#root *{font-family:inherit;box-sizing:border-box}
#root .opacity-60{opacity:1;color:#738478}
#root .font-black{font-weight:750}#root .font-bold{font-weight:600}
#root [class~="border-black"],#root [class~="border-[var(--border)]"]{border-color:var(--border)}
#root [class~="border-[3px]"],#root [class~="border-[2.5px]"],#root [class~="border-[2px]"]{border-width:1px}
#root [class~="border-b-[3px]"],#root [class~="border-t-[3px]"]{border-width:0;border-style:solid;border-color:var(--border)}
#root [class*="shadow-"]{box-shadow:0 4px 18px #294b3410}
#root .bg-black{background:#254d3e;color:#fff}#root .text-black{color:var(--ink)}
#root .bg-green-100{background:#edf8ef}#root .bg-blue-100{background:#edf4fa}#root .bg-orange-100{background:#fff3e8}#root .bg-red-100{background:#fcf0ed}
#root .bg-red-500{background:#c15850}#root .text-red-600{color:#ac4941}#root .text-green-600{color:#24765d}
#root [class*="rounded-[24px]"]{border-radius:20px}#root [class*="rounded-[20px]"]{border-radius:18px}
#root [class*="rounded-[14px]"],#root [class*="rounded-[16px]"]{border-radius:14px}
#root button{min-height:40px;transition:background .16s ease,box-shadow .16s ease,transform .16s ease;touch-action:manipulation;line-height:1.35}
#root button:active{transform:translateY(1px)}#root button:disabled{opacity:.45}
#root button:focus-visible,#root summary:focus-visible{outline:3px solid #77bda0;outline-offset:3px}
#root input,#root select,#root textarea{background:#fbfdfb;border:1px solid #dce6de!important;border-radius:11px!important;color:#243c34;min-width:0;font-size:16px!important;line-height:1.4;min-height:42px;box-shadow:none;font-variant-numeric:tabular-nums}
#root input:focus,#root select:focus,#root textarea:focus{outline:0;border-color:#459778!important;box-shadow:0 0 0 3px #45977818;background:#fff}
#root input::placeholder,#root textarea::placeholder{color:#88958e;font-weight:400}
#root input[type="file"]{max-width:100%;font-size:13px!important}#root input[type="checkbox"]{min-height:20px}
#root button.w-6,#root button.w-7{min-height:30px;height:30px;min-width:30px;flex-shrink:0;padding:0}
#root .app-shell{max-width:560px;border:0;overflow-x:clip}
#root .app-header{background:#fff;padding:24px 20px 16px;gap:14px;border:0;position:relative;z-index:20}
#root .brand-line{display:flex;align-items:center;justify-content:space-between;gap:12px}
#root .brand-lockup{display:flex;align-items:center;gap:11px;min-width:0}
#root .brand-mark{position:relative;width:43px;height:43px;border-radius:14px;background:#254d3e;color:#e3f5ba;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:25px;box-shadow:0 4px 12px #254d3e18;flex-shrink:0}
#root .brand-mark:after{content:"";position:absolute;right:-3px;top:-3px;width:12px;height:12px;background:#f5a561;border:3px solid white;border-radius:50%}
#root [class~="text-[var(--primary)]"]{color:#417b60}
#root .brand-title{font-size:21px;font-weight:750;letter-spacing:-.5px;line-height:1.3}
#root .brand-subtitle{font-size:11px;color:#7c8c82;margin-top:3px;letter-spacing:.5px}
#root .local-chip{font-size:10px;background:#f0f6ee;color:#4c6c58;padding:7px 9px;border-radius:10px;white-space:nowrap}
#root .local-chip:before{content:"";display:inline-block;width:6px;height:6px;background:#66a970;border-radius:50%;margin-right:5px}
#root .vendor-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#root .vendor-tools button{font-size:11px;min-height:32px;padding:6px 10px;background:#f5f8f3;border:0;border-radius:9px;color:#526b5e}
#root .vendor-tools .storage-note{font-size:10px;font-weight:400;color:#86938b;width:100%;margin-top:0}
#root .app-nav{position:sticky;top:var(--safe-area-inset-top);z-index:30;display:flex;gap:4px;overflow-x:auto;background:#fff;padding:8px 14px 12px;border-bottom:1px solid #e6ede4;scrollbar-width:none;scroll-padding:16px;box-shadow:0 6px 12px #304b3210}
#root .app-nav button{display:flex;align-items:center;gap:6px;flex-shrink:0;background:transparent;border:0;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:550;color:#7b8a81;white-space:nowrap;min-height:42px}
#root .app-nav button[aria-current="page"]{background:#e6f4d5;color:#2b5139;font-weight:750}
#root .app-nav svg{width:16px;height:16px;flex-shrink:0}
#root .app-content{padding:20px 16px calc(82px + env(safe-area-inset-bottom,0px))}
#root .app-content>.space-y-3>*+*,#root .app-content>section>*+*{margin-top:16px}
#root .app-content .p-4{padding:20px}#root .app-content .p-3{padding:16px}
#root .app-footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:560px;width:100%;z-index:35;display:flex;align-items:center;justify-content:space-between;background:#ffffffed;border-top:1px solid #e5ece5;padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px));color:#809087;backdrop-filter:blur(14px);font-size:10px}
#root .app-footer .save-state{color:#3d8164;display:flex;align-items:center;gap:5px}
#root .save-state:before{content:"";width:5px;height:5px;background:#6eaa62;border-radius:50%}
#root .analysis-heading{font-size:18px;font-weight:750;margin-bottom:14px}
#root .analysis-periods{display:flex;gap:4px;background:#f0f4ee;border-radius:12px;padding:4px}
#root .analysis-periods button{flex:1;min-width:0;border:0;border-radius:9px;background:transparent;color:#7a887c;font-size:13px;font-weight:550;padding:7px 9px;min-height:36px}
#root .analysis-periods button[aria-pressed="true"]{background:#fff;color:#284e39;box-shadow:0 2px 7px #213e2810;font-weight:750}
#root .range-caption{font-size:10px;color:#849087;margin-top:12px;font-weight:400;line-height:1.7}
#root .profit-context{padding:12px 14px;background:#ecf3e8;border-radius:14px;color:#5c7462;font-size:11px;line-height:1.8}
#root .profit-context strong{color:#315d42;font-weight:650}
#root .profit-review{margin-top:10px;color:#8b6541;background:#fff8ed;border:1px solid #f1e5d1;border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.8}
#root summary{cursor:pointer;font-weight:650;min-height:32px;display:list-item;list-style:revert}
#root .metric-card{border:1px solid #e2ebe2;border-radius:20px;padding:18px 16px;min-width:0;position:relative;overflow:hidden}
#root .metric-card:before{content:"";position:absolute;top:18px;right:15px;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.22}
#root .metric-label{font-size:12px;font-weight:600;color:#6b7a70}
#root .metric-value{font-size:29px;font-weight:750;letter-spacing:-1px;margin:9px 0 10px;font-variant-numeric:tabular-nums;line-height:1.2;overflow-wrap:anywhere}
#root .metric-value.is-pending{font-size:23px;letter-spacing:0;color:#94734e}
#root .metric-change{font-size:10px;font-weight:600;display:inline-block;border-radius:7px;padding:4px 6px;background:#ffffffa6;color:#52836b}
#root .metric-change.is-down{color:#ac6154;background:#ffffffa6}
#root .metric-previous{font-size:10px;color:#8a958d;margin-top:8px}
#root .logic-details{background:#fff;border:1px solid #e3ebe3;border-radius:18px;padding:14px 16px;color:#728176}
#root .logic-details>div{margin-top:10px;color:#65756b}
#root .recharts-text{fill:#8a988d;font-size:10px}#root .recharts-cartesian-grid line{stroke:#edf1ea}
#root .recharts-default-tooltip{border:1px solid #e2eae0!important;border-radius:12px;box-shadow:0 8px 24px #1d3c2815}
#root [role="dialog"]{border-radius:22px!important;border:1px solid #dce8de!important;box-shadow:0 18px 70px #153f2b26!important}
@media(max-width:400px){#root .grid-cols-3{grid-template-columns:repeat(2,minmax(0,1fr))}#root .app-header{padding:20px 16px 14px}#root .brand-title{font-size:20px}#root .metric-card{padding:16px 13px}#root .metric-value{font-size:26px}#root .app-content .p-4{padding:16px}}
@media(prefers-reduced-motion:reduce){#root *,#root *:before,#root *:after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
