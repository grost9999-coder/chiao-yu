name: YingwenStudio
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 5PF59948NJ
    PRODUCT_BUNDLE_IDENTIFIER: com.grost9999.yingwen
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  YingwenStudio:
    type: application
    platform: iOS
    sources: [Sources, Assets.xcassets]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 映文
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryAddUsageDescription: 將你製作的短片儲存到 iPhone 相簿。
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.photo-video
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  YingwenStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: YingwenStudio
schemes:
  YingwenStudio:
    build:
      targets:
        YingwenStudio: all
        YingwenStudioTests: [test]
    test:
      targets: [YingwenStudioTests]
