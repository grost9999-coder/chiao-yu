workflows:
  yingwen-testflight:
    name: 映文 - iPhone TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 40
    integrations:
      app_store_connect: Codemagic-ClearPocket
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.grost9999.yingwen
      vars:
        BUNDLE_ID: com.grost9999.yingwen
        XCODE_PROJECT: apps/yingwen-ios/YingwenStudio.xcodeproj
        XCODE_SCHEME: YingwenStudio
    scripts:
      - name: Install project generator
        script: |
          set -eu
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
      - name: Generate iPhone project
        script: |
          set -eu
          cd "$CM_BUILD_DIR/apps/yingwen-ios"
          xcodegen generate
          agvtool new-version -all "${BUILD_NUMBER:-1}"
      - name: Apply existing Apple signing identities
        script: |
          set -eu
          cd "$CM_BUILD_DIR/apps/yingwen-ios"
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          set -eu
          cd "$CM_BUILD_DIR/apps/yingwen-ios"
          xcode-project build-ipa --project YingwenStudio.xcodeproj --scheme YingwenStudio
    artifacts:
      - apps/yingwen-ios/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
